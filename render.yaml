# Render Blueprint for LifeMind AI
# This file enables one-click deployment to Render

services:
  # Backend API Service
  - type: web
    name: lifemind-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lifemind-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        value: noreply@lifemind.ai
      - key: SMTP_FROM_NAME
        value: LifeMind AI
      - key: ENABLE_EMAIL_NOTIFICATIONS
        value: true
      - key: ENABLE_HABIT_REMINDERS
        value: true
      - key: ENABLE_TASK_REMINDERS
        value: true
      - key: ENABLE_MEETING_REMINDERS
        value: true
      - key: ENABLE_DAILY_SUMMARY
        value: true
      - key: SCHEDULER_ENABLED
        value: true
      - key: SCHEDULER_TIMEZONE
        value: UTC
      - key: PYTHON_VERSION
        value: 3.11.0

  # Frontend Static Site
  - type: web
    name: lifemind-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# Database
databases:
  - name: lifemind-db
    databaseName: lifemind_production
    user: lifemind_user
    plan: free
